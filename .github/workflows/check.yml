name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scripts:
    timeout-minutes: 10
    env:
      SQUAD_KIT_REQUIRE_PWSH: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, shard: 1/5 }
          - { os: macos-latest, shard: 2/5 }
          - { os: macos-latest, shard: 3/5 }
          - { os: macos-latest, shard: 4/5 }
          - { os: macos-latest, shard: 5/5 }
          - { os: ubuntu-24.04, shard: 1/2 }
          - { os: ubuntu-24.04, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache key for tools
        id: tools-key
        run: echo "key=tools-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${{ hashFiles('scripts/ci-install.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore tools cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-install-cache
          key: ${{ steps.tools-key.outputs.key }}
      - name: Install missing tools
        id: install
        env:
          CI_INSTALL_CACHE_DIR: ${{ runner.temp }}/ci-install-cache
        run: bash scripts/ci-install.sh "$RUNNER_OS"
      - name: Save tools cache
        if: steps.install.outputs.source == 'mirror'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-install-cache
          key: ${{ steps.tools-key.outputs.key }}
      - name: Tests
        env:
          SQUAD_KIT_TEST_SHARD: ${{ matrix.shard }}
        run: /bin/bash tests/run.sh
      - name: Syntax and integrity
        if: startsWith(matrix.shard, '1/')
        run: |
          bash scripts/check.sh
          bash scripts/manifest.sh
          git diff --exit-code -- MANIFEST
  assets:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and check the assets
        run: bash scripts/build-assets.sh --commit HEAD "$RUNNER_TEMP/assets"
  content:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content scan
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          umask 077
          mkdir -p tmp
          printf '%s\n' "$FORBIDDEN_TERMS" > tmp/forbidden.txt
          SQUAD_KIT_FORBIDDEN_FILE="$PWD/tmp/forbidden.txt" bash tests/check-content.sh
