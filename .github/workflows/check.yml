name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scripts:
    env:
      SQUAD_KIT_REQUIRE_PWSH: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'macOS'
        run: brew install jq python ripgrep
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bash zsh git jq gh zip unzip python3 tzdata libdigest-sha-perl procps ripgrep
      - name: Tests
        run: /bin/bash tests/run.sh
      - name: Syntax and integrity
        run: |
          bash scripts/check.sh
          bash scripts/manifest.sh
          git diff --exit-code -- MANIFEST
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content scan
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          umask 077
          mkdir -p tmp
          printf '%s\n' "$FORBIDDEN_TERMS" > tmp/forbidden.txt
          SQUAD_KIT_FORBIDDEN_FILE="$PWD/tmp/forbidden.txt" bash tests/check-content.sh
