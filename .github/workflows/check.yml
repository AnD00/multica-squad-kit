name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scripts:
    env:
      SQUAD_KIT_REQUIRE_PWSH: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache key for tools
        id: tools-key
        run: echo "key=tools-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${{ hashFiles('scripts/ci-install.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore tools cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-install-cache
          key: ${{ steps.tools-key.outputs.key }}
      - name: Install missing tools
        id: install
        env:
          CI_INSTALL_CACHE_DIR: ${{ runner.temp }}/ci-install-cache
        run: bash scripts/ci-install.sh "$RUNNER_OS"
      - name: Save tools cache
        if: steps.install.outputs.source == 'mirror'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-install-cache
          key: ${{ steps.tools-key.outputs.key }}
      - name: Tests
        run: /bin/bash tests/run.sh
      - name: Syntax and integrity
        run: |
          bash scripts/check.sh
          bash scripts/manifest.sh
          git diff --exit-code -- MANIFEST
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content scan
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          umask 077
          mkdir -p tmp
          printf '%s\n' "$FORBIDDEN_TERMS" > tmp/forbidden.txt
          SQUAD_KIT_FORBIDDEN_FILE="$PWD/tmp/forbidden.txt" bash tests/check-content.sh
