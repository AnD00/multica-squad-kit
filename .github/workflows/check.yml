name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scripts:
    env:
      SQUAD_KIT_REQUIRE_PWSH: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install missing tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          missing=()
          command -v jq >/dev/null 2>&1 || missing+=(jq)
          command -v python3 >/dev/null 2>&1 || missing+=(python)
          [ "${#missing[@]}" -eq 0 ] && { echo "nothing to install"; exit 0; }
          for i in 1 2 3; do
            brew install "${missing[@]}" && exit 0
            echo "brew install failed (attempt $i)"; sleep $((i * 10))
          done
          exit 1
      - name: Install missing tools (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=()
          for p in bash zsh git jq gh zip unzip python3 tzdata libdigest-sha-perl procps; do
            dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p")
          done
          [ "${#missing[@]}" -eq 0 ] && { echo "nothing to install"; exit 0; }
          echo "missing: ${missing[*]}"
          for i in 1 2 3 4; do
            sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y "${missing[@]}" && exit 0
            echo "apt-get failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1
      - name: Tests
        run: /bin/bash tests/run.sh
      - name: Syntax and integrity
        run: |
          bash scripts/check.sh
          bash scripts/manifest.sh
          git diff --exit-code -- MANIFEST
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content scan
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          umask 077
          mkdir -p tmp
          printf '%s\n' "$FORBIDDEN_TERMS" > tmp/forbidden.txt
          SQUAD_KIT_FORBIDDEN_FILE="$PWD/tmp/forbidden.txt" bash tests/check-content.sh
